name: Release

# 触发:推送 v* 标签(例如 v1.0.0)。打包本身是纯下载 + 拷贝,不涉及交叉编译,
# 所以 x64 与 arm64 两种目标架构都能在 ubuntu-latest 上构建(见
# scripts/build-release.sh 头部注释)。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # 发布说明里那条安装命令指向哪个仓库,以及 install.sh 的默认下载源。
  # 这是本 fork,所以指向自己:脚本与资产都在这个仓库里。
  OPENBOX_REPO: xuzhike123/Open-Box
  # build-release.sh 在 OPENBOX_SLIM=1(默认)下会用 Go 现场精简编译 sing-box;
  # sing-box 的 go.mod 声明了 go 1.24.7,这里取 1.25 系列(>= 要求即可)。
  GO_VERSION: '1.25'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 精简打包的两条构建期依赖(见 scripts/build-release.sh 头部"精简打包(SLIM)"):
      #   - Go:现场把 sing-box 按精简 tag 编出来,替掉 40.8MB 的全功能发布资产
      #   - upx:压缩 node/bin/node(93.8MB -> 约 28MB),这是整包里最大的一块
      # 少任何一个,build-release.sh 都会在开头明确报错并告诉你该怎么关掉
      # (OPENBOX_SLIM=0 / OPENBOX_UPX=0),不会打到一半才失败。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install upx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl || sudo apt-get install -y -qq upx
          upx --version

      - name: Enable Corepack
        run: corepack enable

      # build-release.sh 自己不装依赖(见其头部注释与 Task 5 brief 的 job 结构),
      # 依赖安装是这一步的职责;装在 panel/ 下即可覆盖 panel 本体与 panel/server
      # 这两个 pnpm workspace 成员(panel/pnpm-workspace.yaml)。
      - name: Install panel dependencies
        working-directory: panel
        run: corepack pnpm install --frozen-lockfile

      # OPENBOX_VERSION 直接取 github.ref_name(推送 v1.2.3 标签时即为 "v1.2.3"),
      # 写入产物的 meta.json 供面板展示版本号,也用来拼带版本号的留档资产名
      # open-box-<version>-linux-<arch>.tar.gz。install.sh/update.sh 不再依赖这个
      # 字符串去拼下载 URL——它们用不带版本号的稳定资产名(见下面 Upload artifact
      # 步骤的注释与 Important 5),真正装的是哪个版本,由它们在下载校验通过后自己
      # 从 meta.json 里读出来。
      # 发版前先跑测试:发布流水线原本是唯一的 CI,却从不跑测试套件,于是"套件是红的"
      # 拦不住发版(实际发生过:v0.1.2 就是在本地套件报 2 条失败的情况下打的 tag)。
      # 两个架构的构建都会跑一遍——重复但便宜,而且任一失败都能拦住整个发布。
      - name: Run server test suite
        working-directory: panel
        run: corepack pnpm run test:server

      - name: Verify generated config against pinned sing-box
        working-directory: panel
        run: corepack pnpm run check:config

      - name: Build release tarball
        env:
          OPENBOX_VERSION: ${{ github.ref_name }}
          # 走脚本内的默认值(都是 1);这里显式列出来,是为了让不碰代码也能在两个
          # 仓库变量里把精简行为关掉:Settings → Secrets and variables → Variables。
          #   OPENBOX_SLIM=0  → 打回完整包(解包约 167MB,小 flash 机型装不下)
          #   OPENBOX_UPX=0   → 不压缩 node(包大 65MB 左右,但不额外吃运行时内存)
          OPENBOX_SLIM: ${{ vars.OPENBOX_SLIM || '1' }}
          OPENBOX_UPX: ${{ vars.OPENBOX_UPX || '1' }}
        run: bash scripts/build-release.sh ${{ matrix.arch }} dist-release

      # build-release.sh 每个架构都产出两份内容完全一致的 tarball(+sha256):带版本号
      # 的 open-box-<version>-linux-<arch>.tar.gz(留档)和不带版本号的
      # open-box-linux-<arch>.tar.gz(install.sh / update.sh 靠这份稳定资产名通过
      # releases/latest/download/<asset> 直链拿最新版,不查询 api.github.com——见
      # Important 5)。这里用通配符收集 dist-release/ 下的全部 *.tar.gz / *.sha256,
      # 两种命名都会被原样带到下面的 Release 里,不需要在这一步分别枚举文件名——
      # 三处名字(build-release.sh 产出名 / 这里上传名 / install-update.sh 计算名)
      # 保持一致的关键在 build-release.sh 与 install.sh/update.sh 两侧的命名规则,
      # 而不是这里的通配符。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-box-linux-${{ matrix.arch }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List release assets
        run: ls -la dist-release

      # sing-box/Node 版本号只在 scripts/build-release.sh 里维护一份,这里现读现取,
      # 避免版本号在脚本与发布说明里各写一份、迟早漂移。
      - name: Compose release notes
        run: |
          set -eu
          NODE_VERSION=$(grep -m1 '^NODE_VERSION=' scripts/build-release.sh | sed -E 's/^NODE_VERSION="([^"]+)"/\1/')
          SINGBOX_VERSION=$(grep -m1 '^SINGBOX_VERSION=' scripts/build-release.sh | sed -E 's/^SINGBOX_VERSION="([^"]+)"/\1/')
          {
            echo "## Open-Box ${{ github.ref_name }}"
            echo ""
            echo "- sing-box 内核版本:\`$SINGBOX_VERSION\`(从源码按精简 tag 编译,musl 静态链接)"
            echo "- Node 运行时版本:\`$NODE_VERSION\`(musl 构建,glibc 版本在 OpenWrt 上无法运行)"
            echo ""
            echo "### 体积"
            echo ""
            echo "本仓库打的是**精简包**,面向 128MB NAND 的小 flash 路由器(如红米 AX6)。"
            echo "解包后约 65~70MB,而完整包是约 167MB。逐项实测数据与取舍见"
            echo "\`scripts/build-release.sh\` 头部的\"精简打包(SLIM)\"注释。"
            echo ""
            echo "### 硬件要求"
            echo ""
            echo "- CPU 架构:x86_64 或 arm64(aarch64)"
            echo "- 可用存储:≥ 96MB(精简包;留出 data/ 规则集与统计的增长余量)"
            echo "- 可用内存:≥ 512MB(UPX 压缩过的 node 启动时会多占几十 MB)"
            echo "- 系统:OpenWrt(含 ImmortalWrt / iStoreOS)"
            echo ""
            echo "### 一键安装"
            echo ""
            echo '```bash'
            echo "# 直连版"
            echo "curl -fsSL https://raw.githubusercontent.com/${OPENBOX_REPO}/main/scripts/install.sh | sh"
            echo ""
            echo "# 镜像加速版(国内推荐:内置镜像列表会自动探测)"
            echo "curl -fsSL https://gh-proxy.com/https://raw.githubusercontent.com/${OPENBOX_REPO}/main/scripts/install.sh | sh -s -- --mirror"
            echo '```'
            echo ""
            echo "完整安装 / 升级 / 卸载说明见仓库根目录 README。"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Open-Box ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-release/*.tar.gz
            dist-release/*.sha256
